name: build-test-deploy

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x
      - run: npm install
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Unit test
        run: echo "unit test"

      - name: Integration test
        run: echo "integration test"

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Deploy
        run: echo "Deploy"
