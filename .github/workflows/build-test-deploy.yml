name: build-test-deploy

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build
        run: echo "Build"

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Unit test
        run: echo "unit test"

      - name: Integration test
        run: echo "integration test"

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Deploy
        run: echo "Deploy"
